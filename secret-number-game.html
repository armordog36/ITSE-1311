<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Number Game</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f2f2f2;
    padding: 40px;
}

.container{
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

h1{
    color: #333;
}

#result{
    font-size: 18px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
<h1>Secret Number Game</h1>
<p>Guess the secret favorite number between 1 and 5!</p>

<div id="result"></div>
</div>

<script>

// Secret number variable
let secretNumber = 3;

// Points variable
let points = 0;

// Prompt user for guess
let guess = prompt("Guess the secret favorite number between 1 and 5");

// Loop until user enters a number
while (isNaN(guess)) {
    guess = prompt("Invalid input. Please enter a NUMBER between 1 and 5.");
}

// Convert guess to number
guess = Number(guess);

// Compare guess to secret number
if (guess === secretNumber) {
    points = 10;
    document.getElementById("result").innerHTML =
        "🎉 Congratulations! You guessed the secret number.<br> Your score: " + points + " points.";
} 
else {
    points = 0;
    document.getElementById("result").innerHTML =
        "😔 Sorry, that was not the secret number.<br> Your score: " + points + " points.";
}

</script>

</body>
</html>
